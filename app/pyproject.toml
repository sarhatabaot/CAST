dependencies = [
    "tomtoolkit==2.30.1",
    "django-environ==0.12.0",
    "psycopg[binary]>=3.3.2",
    "pandas==2.3.3",
    "pandas-stubs==2.3.3.260113",
    "lasair==0.1.2",
    "astropy>=5.3.4",
    "astroquery>=0.4.7",
    "astroplan>=0.10.1",
    "plotly>=5.24.1",
    "pillow>=11.0.0",
    "scipy>=1.14.1",
    "numpy==2.1.3",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "gspread>=6.0.0",
    "redis>=7.1.0",
    "clickhouse-connect",
    "matplotlib",
    "pydantic",
