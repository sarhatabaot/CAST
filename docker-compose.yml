services:
  web:
    build: ./app
    container_name: cast_web
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app/:/app/
      - ./app/large_files:/app/large_files
      - static_data:/app/static
      - media_data:/app/data
      - .db.sqlite3:/app/.db.sqlite3
      - /mnt/euclid/last/data/transients:/transients:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      collect-static:
        condition: service_completed_successfully

  scheduler:
    image: mcuadros/ofelia:latest
    container_name: ofelia_scheduler
    depends_on:
      - web
    command: daemon --docker
    volumes:
      # Allows Ofelia to talk to the Docker engine to trigger commands
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Asia/Jerusalem
    labels:
      ofelia.job-exec.ingest.schedule: "0 0 7 * * *"
      ofelia.job-exec.ingest.container: "cast_web"
      ofelia.job-exec.ingest.command: "uv run manage.py ingest_candidates --cutoff 1"

  redis:
    image: redis:8.4
    command: >
      redis-server
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: ./app
    entrypoint: uv run manage.py migrate
    volumes:
      - ./app/:/app/
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"  # Run once and exit

  collect-static:
    build: ./app
    command: uv run manage.py collectstatic --noinput
    volumes:
      - ./app/:/app/
      - static_data:/app/static
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  media_data:
  static_data:
